name: product-management

services:
  postgres:
    image: postgres:16-alpine
    container_name: product-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_management}
      POSTGRES_USER: ${POSTGRES_USER:-product_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-product_password}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - product_management_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: product-management-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/product_management}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-product_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-product_password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_API_USERNAME: ${APP_API_USERNAME:-admin}
      APP_API_PASSWORD: ${APP_API_PASSWORD:-admin123}
    ports:
      - "${SERVER_PORT:-18080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18080}
    container_name: product-management-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  product_management_postgres_data:
