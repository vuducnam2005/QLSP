spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    show-sql: false

server:
  shutdown: graceful

app:
  security:
    username: ${APP_API_USERNAME}
    password: ${APP_API_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: ${SERVER_SESSION_COOKIE_SECURE:true}
        same-site: ${SERVER_SESSION_COOKIE_SAME_SITE:LAX}

management:
  endpoints:
    web:
      exposure:
        include: health,info
